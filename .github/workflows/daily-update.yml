name: Daily Real Estate & Subscription Data Update

on:
  schedule:
    # 매일 한국시간 오전 6시 (UTC 21:00) 자동 실행
    - cron: '0 21 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Run daily Seoul & Gyeonggi real estate & subscription updater
        working-directory: ./backend
        run: python daily_update.py

      - name: Commit and push updated data to main and gh-pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.js frontend/data.js
          git diff --staged --quiet || (git commit -m "Auto-update: Daily Seoul & Gyeonggi real estate & subscription data ($(date +'%Y-%m-%d'))" && git push origin main && git push origin main:gh-pages --force)
